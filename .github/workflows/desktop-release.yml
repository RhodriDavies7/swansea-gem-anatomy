name: Publish desktop apps
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Mac Apple Silicon, runner: macos-15, platform: mac, arch: arm64}
          - {name: Mac Intel, runner: macos-15-intel, platform: mac, arch: x64}
          - {name: Windows, runner: windows-latest, platform: win, arch: x64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set unique build version
        run: node scripts/release-version.mjs
      - run: npm run build:data
      - run: npm run desktop:vendor
      - run: npm test
      - name: Package Windows installer
        if: runner.os == 'Windows'
        run: npx electron-builder --win --x64 --publish never
      - name: Package signed Mac application
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --${{ matrix.arch }} --dir --publish never
      - name: Create and mount-test Mac installer
        if: runner.os == 'macOS'
        run: node scripts/package-mac-dmg.mjs ${{ matrix.arch }}
      - name: Check Windows launch and saved progress
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ANATOMY_SMOKE_DIR = Join-Path $env:RUNNER_TEMP 'anatomy-release-smoke'
          $process = Start-Process -FilePath '.\release\win-unpacked\Swansea GEM Anatomy.exe' -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'App launch timed out' }
          if ($process.ExitCode -ne 0) { throw 'App launch failed' }
          $result = Get-Content (Join-Path $env:ANATOMY_SMOKE_DIR 'smoke-result.json') -Raw | ConvertFrom-Json
          if (-not $result.bridge -or -not $result.dashboard -or -not $result.report -or $result.records -ne 1) { throw 'Desktop review check failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set release version
        id: version
        run: node scripts/release-version.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          test "$(find installers -maxdepth 1 -type f | wc -l)" -eq 3
          cd installers
          sha256sum *.dmg *.exe > SHA256SUMS.txt
          cd ..
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo 'This version is already published; keeping its downloads unchanged.'
            exit 0
          fi
          gh release create "v$RELEASE_VERSION" installers/* --target "$RELEASE_SHA" --title "Swansea GEM Anatomy $RELEASE_VERSION — Mac & Windows" --notes-file desktop/AUTO-RELEASE-NOTES.md --latest
